[package]
name = "bonsai-desktop"
version = "29.0.0"
edition = "2021"
authors = ["BonsaiEcosystem Team"]
description = "BonsaiEcosystem Desktop Environment - Enterprise-grade next-generation desktop OS"
license = "Omnisystem-Enterprise"
repository = "https://github.com/omnisystem/bonsai-ecosystem"
keywords = ["desktop", "gui", "ui", "ecosystem", "omnisystem"]
categories = ["gui"]

[workspace]

[[bin]]
name = "Omnisystem"
path = "src/launcher/main.rs"

[[bin]]
name = "Omnisystem_TUI"
path = "src/launcher/tui.rs"

[dependencies]
crossterm = "0.27"
ratatui = "0.26"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
