[workspace]
resolver = "2"

[package]
name = "omnisystem-framework"
version = "2.0.0"
edition = "2021"

[lib]
name = "omnisystem_framework"
path = "lib.rs"

[[bin]]
name = "omnisystem-demo"
path = "demo.rs"

[dependencies]
# Zero external dependencies - all functionality is built-in

[dev-dependencies]
# No test dependencies needed

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

# Features for different use cases
[features]
default = ["all-languages", "hot-reload", "zero-deps"]
all-languages = []
hot-reload = []
zero-deps = []
atomic-compilation = []
language-interop = []
