# Vera bootstrap seed — Rust host for the Vera runtime.
# Standalone workspace: deliberately detached from the (broken) repo-root
# Cargo workspace, same as OmniHarness/kernel and the other bootstrap-*-rs seeds.
[workspace]

[package]
name = "vera-seed"
version = "0.1.0"
edition = "2021"
description = "Vera bootstrap — lexer, parser, and tree-walking runtime with embedded reactive markup (components, signals, computed values) (Rust seed)"
license = "MIT"

[[bin]]
name = "vera-seed"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 3
