[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniharness"
version = "1.0.0"
description = "OmniHarness AI Orchestrator — multi-provider LLM routing, ReAct agents, memory, and gRPC kernel bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Omnisystem" }]

dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "anthropic>=0.40",
    "openai>=1.55",
    "cohere>=5",
    "mistralai>=1.0",
    "groq>=0.9",
    "google-generativeai>=0.8",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "rich>=13",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "aiofiles>=23",
    "websockets>=12",
    "aiosqlite>=0.20",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx",
    "anyio",
]

[project.scripts]
omniharness = "omniharness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["omniharness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
