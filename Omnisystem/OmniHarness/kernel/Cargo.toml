# Empty [workspace] table detaches this crate from the broken parent workspace
# (z:/Projects/Omnisystem/Cargo.toml, whose thousands of src/crates/* members do
# not all resolve). The kernel builds standalone.
[workspace]

[package]
name    = "omniharness-kernel"
version = "1.0.0"
edition = "2021"
description = "OmniHarness Rust Kernel — event store, model router, vector store, gRPC, mesh"

[dependencies]
# Async runtime
tokio            = { version = "1",    features = ["full"] }
tokio-stream     = "0.1"
futures          = "0.3"

# gRPC — prost 0.13 matches tonic 0.12 (tonic-build emits prost-0.13 code)
tonic            = { version = "0.12", features = ["tls", "tls-roots"] }
prost            = "0.13"

# Serialization
serde            = { version = "1",    features = ["derive"] }
serde_json       = "1"

# Crypto / hashing
sha2             = "0.10"
hex              = "0.4"
rand             = "0.8"

# Time
chrono           = { version = "0.4",  features = ["serde"] }
uuid             = { version = "1",    features = ["v4"] }

# HTTP (model routing)
reqwest          = { version = "0.13", features = ["json", "stream", "rustls-tls"], default-features = false }
bytes            = "1"

# Concurrency
dashmap          = "6"
parking_lot      = "0.12"

# Web server (REST/WebSocket sidecar)
axum             = { version = "0.8",  features = ["ws"] }
tower            = "0.5"
tower-http       = { version = "0.6",  features = ["cors", "trace"] }

# P2P mesh
libp2p           = { version = "0.54", features = [
    "tokio", "tcp", "noise", "yamux",
    "gossipsub", "mdns", "identify", "macros",
] }

# WASM sandbox
wasmtime         = "46"
wasmtime-wasi    = "46"

# Logging
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow           = "1"
thiserror        = "1"

# File I/O
tokio-util       = { version = "0.7", features = ["io"] }

[dev-dependencies]
# Used by the #[cfg(test)] modules in event_store.rs / vector_store.rs
tempfile = "3"

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "omniharness-kernel"
path = "src/main.rs"

[profile.release]
lto       = true
codegen-units = 1
opt-level = 3
