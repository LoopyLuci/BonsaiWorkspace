[package]
name = "ir"
version = "1.0.0"
edition = "2021"
authors = ["Omnisystem Team"]
license = "Apache-2.0"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
ir-repr = { path = "../ir-repr" }
# Titan (bootstrap-rs) — real lexer/parser reused as a library so the `ir`
# crate can lower real Titan source to UniIR without re-implementing a
# parser. `bootstrap-rs` declares its own empty `[workspace]` table (it is
# deliberately detached from this repo's broken root workspace, same as
# OmniHarness/kernel), so pulling it in here as a path dependency gives it
# its own isolated dependency resolution rather than joining this crate's
# workspace.
titan = { path = "../../../bootstrap-rs" }

[lib]
name = "ir"
path = "src/lib.rs"

[[bin]]
name = "ir_cli"
path = "src/bin/cli.rs"

[[bin]]
name = "omnicc"
path = "src/bin/omnicc.rs"

[dev-dependencies]


