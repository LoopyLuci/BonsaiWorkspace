[package]
autobins = false
name    = "p2p-core"
version = "2.0.0"
edition = "2021"
description = "Deterministic core of TransferDaemon v2 - connection state machine, scheduler, congestion control"

[dependencies]
p2p-crypto = { path = "../p2p-crypto" }
tokio     = { version = "1", features = ["full"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
tracing    = "0.1"
blake3     = "1"
uuid       = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
bytes      = "1"
dashmap    = "5"
parking_lot = "0.12"
anyhow     = "1"

[features]
default = ["deterministic-core"]
deterministic-core = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lib]
name = "p2p_core"
path = "src/lib.rs"
