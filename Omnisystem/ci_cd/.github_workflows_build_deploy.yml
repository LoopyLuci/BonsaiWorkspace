name: Omnisystem GUI - Build & Deploy Pipeline
on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: omnisystem-gui

jobs:
  # ===========================================================================
  # STAGE 1: CODE QUALITY & LINT
  # ===========================================================================
  code-quality:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Titan toolchain
        run: |
          curl -sSf https://omnisystem.dev/install-titan | sh
          echo "$HOME/.titan/bin" >> $GITHUB_PATH

      - name: Lint TITAN code
        run: |
          titan lint Omnisystem/gui/**/*.titan --strict

      - name: Check code formatting
        run: |
          titan fmt --check Omnisystem/gui/**/*.titan

      - name: Static analysis
        run: |
          titan analyzer Omnisystem/gui/ --strict

      - name: Complexity analysis
        run: |
          titan complexity Omnisystem/gui/ --max=5

      - name: OWASP security scan
        run: |
          titan security scan Omnisystem/gui/ --owasp-top-10

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Code quality checks passed ✅'
            })

  # ===========================================================================
  # STAGE 2: UNIT & INTEGRATION TESTS
  # ===========================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v3

      - name: Set up Titan toolchain
        run: |
          curl -sSf https://omnisystem.dev/install-titan | sh
          echo "$HOME/.titan/bin" >> $GITHUB_PATH

      - name: Run unit tests
        run: |
          titan test testing/test_framework.titan --type unit --verbose
        env:
          TEST_TIMEOUT: 300

      - name: Run integration tests
        run: |
          titan test testing/test_framework.titan --type integration --verbose
        env:
          TEST_TIMEOUT: 600

      - name: Generate coverage report
        run: |
          titan test testing/ --coverage --coverage-format=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage.xml
          flags: unittests
          name: codecov-omnisystem

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  # ===========================================================================
  # STAGE 3: PERFORMANCE TESTS
  # ===========================================================================
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v3

      - name: Set up Titan toolchain
        run: |
          curl -sSf https://omnisystem.dev/install-titan | sh
          echo "$HOME/.titan/bin" >> $GITHUB_PATH

      - name: Run performance benchmarks
        run: |
          titan bench testing/test_framework.titan --baseline=baseline.json

      - name: Compare with baseline
        run: |
          titan bench compare current.json baseline.json --threshold=5%

      - name: Generate performance report
        run: |
          titan bench report current.json --format=html

      - name: Comment PR with performance
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Performance tests passed - no regressions ✅'
            })

  # ===========================================================================
  # STAGE 4: SECURITY SCANNING
  # ===========================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run dependency check
        run: |
          curl -sSL https://dependency-check.github.io/dependency-check_7.4.4_all.deb -o dc.deb
          sudo dpkg -i dc.deb
          /usr/share/dependency-check/bin/dependency-check.sh --scan . --format JSON

      - name: SAST scan with Sonatype
        run: |
          titan security sast Omnisystem/gui/ --json --output=sast.json

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # ===========================================================================
  # STAGE 5: BUILD
  # ===========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, performance, security]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest

  # ===========================================================================
  # STAGE 6: ACCESSIBILITY & WCAG VALIDATION
  # ===========================================================================
  accessibility:
    name: Accessibility Tests (WCAG AAA)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3

      - name: Set up axe-core scanning
        run: |
          npm install -g @axe-core/cli

      - name: Run accessibility audit
        run: |
          axe https://staging.omnisystem.dev --tags wcag2aa,wcag2aaa --json > a11y-results.json

      - name: Check WCAG AAA compliance
        run: |
          titan accessibility audit Omnisystem/gui/ --level AAA --strict

      - name: Generate accessibility report
        run: |
          python3 scripts/generate-a11y-report.py a11y-results.json

  # ===========================================================================
  # STAGE 7: E2E TESTS (STAGING)
  # ===========================================================================
  e2e-staging:
    name: E2E Tests (Staging)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to staging
        run: |
          ./deployment/deploy-staging.sh

      - name: Wait for deployment
        run: |
          ./deployment/wait-for-deployment.sh staging 300

      - name: Run E2E tests
        run: |
          titan test testing/test_framework.titan --type e2e --env staging --verbose
        env:
          STAGING_URL: https://staging.omnisystem.dev
          E2E_TIMEOUT: 600

      - name: Capture screenshots on failure
        if: failure()
        run: |
          ./scripts/capture-screenshots.sh

  # ===========================================================================
  # STAGE 8: DEPLOY TO STAGING
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [e2e-staging, accessibility]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: https://staging.omnisystem.dev
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions
          aws-region: us-east-1

      - name: Deploy to staging
        run: |
          ./deployment/deploy-staging.sh
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: us-east-1

      - name: Run health checks
        run: |
          ./deployment/health-check.sh staging

      - name: Notify deployment
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"✅ Deployed to staging: ${{ github.sha }}"}'

  # ===========================================================================
  # STAGE 9: DEPLOY TO PRODUCTION (MAIN ONLY)
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://omnisystem.dev
    steps:
      - uses: actions/checkout@v3

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: Production deployment

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions
          aws-region: us-east-1

      - name: Execute blue-green deployment
        run: |
          ./deployment/deploy-production.sh --strategy blue-green
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: us-east-1

      - name: Run production health checks
        run: |
          ./deployment/health-check.sh production --retries 10

      - name: Verify performance
        run: |
          ./deployment/verify-performance.sh

      - name: Notify team
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "🚀 Production deployment successful",
              "blocks": [{
                "type": "section",
                "text": {"type": "mrkdwn", "text": "*Production Deployment*\n✅ All systems operational\n🔗 https://omnisystem.dev"}
              }]
            }'

  # ===========================================================================
  # STAGE 10: POST-DEPLOYMENT MONITORING
  # ===========================================================================
  monitor:
    name: Post-Deployment Monitoring
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()
    steps:
      - uses: actions/checkout@v3

      - name: Setup monitoring
        run: |
          ./monitoring/setup-monitoring.sh

      - name: Verify metrics collection
        run: |
          ./monitoring/verify-metrics.sh

      - name: Create monitoring dashboard
        run: |
          ./monitoring/create-dashboard.sh

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: deployment-logs
          path: logs/
          retention-days: 90
