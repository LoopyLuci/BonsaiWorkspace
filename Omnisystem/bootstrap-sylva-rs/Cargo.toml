# Sylva bootstrap seed — Rust host for the Sylva runtime.
# Standalone workspace: deliberately detached from the (broken) repo-root
# Cargo workspace, same as OmniHarness/kernel and Omnisystem/bootstrap-rs.
[workspace]

[package]
name = "sylva-seed"
version = "0.1.0"
edition = "2021"
description = "Sylva bootstrap — lexer, parser, and tree-walking runtime with ML/tensor + pipeline domain builtins (Rust seed)"
license = "MIT"

[[bin]]
name = "sylva-seed"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 3
