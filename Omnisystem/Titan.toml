[package]
name = "omnisystem-graphics"
version = "31.0.0"
edition = "2024"
authors = ["Omnisystem Team <rechargedideas@gmail.com>"]
description = "Omnisystem Graphics Application - Real-time GPU-accelerated desktop environment"
license = "Proprietary"
repository = "https://github.com/omnisystem/omnisystem"
homepage = "https://omnisystem.io"
documentation = "https://docs.omnisystem.io"
readme = "README.md"
keywords = ["graphics", "gpu", "ui", "desktop", "rendering"]
categories = ["graphics", "os", "desktop"]

[dependencies]
# GPU Drivers
helix-graphics = "1.0"          # HELIX graphics rendering engine
gpu-drivers = "1.0"             # All GPU drivers (AMD, Intel, Nvidia, ARM, Apple)
vulkan-abstraction = "1.0"      # Vulkan cross-platform abstraction
opengl-es = "1.0"               # Mobile graphics support
gpu-memory = "1.0"              # Unified GPU memory management

# UI Framework
vera-ui = "1.0"                 # VERA UI framework
vera-graphics = "1.0"           # VERA graphics integration
ui-components = "1.0"           # 20+ UI components

# Core Systems
titan-systems = "1.0"           # TITAN service manager, scheduling
aether-networking = "1.0"       # AETHER distributed systems
axiom-verification = "1.0"      # AXIOM formal verification
sylva-ml = "1.0"                # SYLVA machine learning
nexus-responsive = "1.0"        # NEXUS responsive design

# Standard Library
titan-stdlib = "1.0"            # Titan standard library
titan-collections = "1.0"       # Vec, HashMap, etc.
titan-io = "1.0"                # File I/O, streams
titan-time = "1.0"              # Timing, profiling
titan-sync = "1.0"              # Threading, locks, channels
titan-math = "1.0"              # Math functions, matrices

# Serialization
serde = "1.0"                   # Serialization framework
json = "1.0"                    # JSON support
toml = "1.0"                    # TOML parsing

[dev-dependencies]
titan-test = "1.0"              # Testing framework
criterion = "1.0"               # Benchmarking

[build-dependencies]
titan-build = "1.0"             # Build system

[[bin]]
name = "omnisystem-graphics"
path = "launchers/OmnisystemGraphicsLauncher.titan"
required-features = []

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 256

[profile.release]
opt-level = 3
debug = true
debug-assertions = false
overflow-checks = false
lto = true
codegen-units = 1
strip = false

[profile.bench]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
codegen-units = 1

[features]
default = ["graphics", "ui", "gpu-detection"]
graphics = ["helix-graphics", "gpu-drivers", "gpu-memory"]
ui = ["vera-ui", "vera-graphics", "ui-components"]
gpu-detection = ["gpu-drivers"]
vulkan = ["vulkan-abstraction"]
opengl = ["opengl-es"]
raytrace = ["helix-graphics"]
profiling = ["titan-time"]
debug-ui = ["vera-ui"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.omnisystem]
target-os = ["windows", "macos", "linux"]
target-arch = ["x86_64", "arm64"]
requires-gpu = true
graphics-backends = ["vulkan", "metal", "directx12", "opengl_es"]
