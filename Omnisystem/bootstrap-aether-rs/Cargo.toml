# Aether bootstrap seed — Rust host for the Aether runtime.
# Standalone workspace: deliberately detached from the (broken) repo-root
# Cargo workspace, same as OmniHarness/kernel and Omnisystem/bootstrap-rs.
[workspace]

[package]
name = "aether-seed"
version = "0.1.0"
edition = "2021"
description = "Aether bootstrap — lexer, parser, and tree-walking runtime with Erlang/OTP-flavored actors + pattern-matched multi-clause functions (Rust seed)"
license = "MIT"

[[bin]]
name = "aether-seed"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 3
