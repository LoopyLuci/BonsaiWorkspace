# Nexus bootstrap seed — Rust host for the Nexus layout/constraint solver.
# Standalone workspace: deliberately detached from the (broken) repo-root
# Cargo workspace, same as OmniHarness/kernel and the other bootstrap-*-rs seeds.
[workspace]

[package]
name = "nexus-seed"
version = "0.1.0"
edition = "2021"
description = "Nexus bootstrap — a real declarative constraint/layout solver (box properties, flow layout, Cassowary-style constraint checking), not a general-purpose imperative language (Rust seed)"
license = "MIT"

[[bin]]
name = "nexus-seed"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 3
