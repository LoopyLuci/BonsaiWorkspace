# Helix bootstrap seed — Rust host for the Helix GPU/compute-kernel DSL.
# Standalone workspace: deliberately detached from the (broken) repo-root
# Cargo workspace, same as OmniHarness/kernel and the other bootstrap-*-rs seeds.
[workspace]

[package]
name = "helix-seed"
version = "0.1.0"
edition = "2021"
description = "Helix bootstrap — first-class swizzled vector types, data-parallel kernel dispatch, and real enforced GPU-shader restrictions (bounded loops, no recursion) (Rust seed)"
license = "MIT"

[[bin]]
name = "helix-seed"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 3
