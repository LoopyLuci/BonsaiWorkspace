# OmniCC bootstrap seed — Rust host for the Titan runtime.
# Standalone workspace: deliberately detached from the (broken) repo-root
# Cargo workspace, same as OmniHarness/kernel.
[workspace]

[package]
name = "titan"
version = "0.2.0"
edition = "2021"
description = "Titan — real lexer, parser, and tree-walking interpreter (the only Omni-Language with a working toolchain today)"
license = "MIT"

[[bin]]
name = "titan"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 3

[dependencies]
lsp-server = "0.7.9"
lsp-types = "0.97.0"
serde_json = "1.0.150"
url = "2.5.8"
