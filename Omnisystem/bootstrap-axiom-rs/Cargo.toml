# Axiom bootstrap seed — Rust host for the Axiom formal-verification checker.
# Standalone workspace: deliberately detached from the (broken) repo-root
# Cargo workspace, same as OmniHarness/kernel and the other bootstrap-*-rs seeds.
[workspace]

[package]
name = "axiom-seed"
version = "0.1.0"
edition = "2021"
description = "Axiom bootstrap — a real bounded-exhaustive theorem verifier and explicit-state invariant checker (not example-based testing, not a full dependent type theory) (Rust seed)"
license = "MIT"

[[bin]]
name = "axiom-seed"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 3
