[module]
name = "omnisystem-omnisystem-ecosystem"
version = "1.0.0"
description = "Omnisystem Ecosystem - Desktop launcher, UOSC runtime, and orchestration"
author = "Omnisystem Team"

[module.capabilities]
"omnisystem:launcher" = { enabled = true, description = "Desktop launcher application" }
"omnisystem:runtime" = { enabled = true, description = "UOSC runtime environment" }
"omnisystem:orchestration" = { enabled = true, description = "Service orchestration" }
"omnisystem:ui" = { enabled = true, description = "User interface" }

[omnios_mode]
launcher_enabled = true
runtime_enabled = true
orchestration_enabled = true
auto_start = true

[omnisystem_mode]
launcher_enabled = true
runtime_enabled = true
orchestration_enabled = false
auto_start = true

[module.config]
launcher_enabled = true
runtime_enabled = true
orchestration_enabled = true
ui_theme = "auto"
auto_start = true
