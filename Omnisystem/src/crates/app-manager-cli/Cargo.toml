[package]
name = "app-manager-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
app-manager-core = { path = "../app-manager-core" }
app-manager-config = { path = "../app-manager-config" }
app-manager-omnisystem-integration = { path = "../app-manager-omnisystem-integration" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
colored = "2"

[lib]
name = "app_manager_cli"
path = "src/lib.rs"

[[bin]]
name = "app_manager_cli_cli"
path = "src/bin/cli.rs"

[dev-dependencies]
tempfile = { workspace = true }

