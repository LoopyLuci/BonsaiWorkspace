[package]
name = "bmn-compositor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
glam = { version = "0.29", features = ["serde"] }
bmn-common = { path = "../bmn-common" }
tracing = { workspace = true, optional = true }

[features]
# Placeholder for a real GPU (Vulkan) render backend; currently only gates
# a log line since no Vulkan implementation exists yet.
vulkan = ["dep:tracing"]

[lib]
name = "bmn_compositor"
path = "src/lib.rs"

[[bin]]
name = "bmn_compositor_cli"
path = "src/bin/cli.rs"

[dev-dependencies]


