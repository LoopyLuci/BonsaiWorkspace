[package]
name = "universal-language-layer"
version = "1.0.0"
edition = "2021"
authors = ["Omnisystem Contributors"]
description = "Universal Language Layer (ULL) - FFI and interop bridge for all Omnisystem languages"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
dashmap = "5.5"
parking_lot = "0.12"
log = "0.4"
uuid = { version = "1.6", features = ["v4"] }
libloading = "0.8"
once_cell = "1.19"

# FFI support
libc = "0.2"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "ull_benchmarks"
harness = false

[lib]
name = "universal_language_layer"
path = "src/lib.rs"

[[example]]
name = "rust_to_titan_bridge"
path = "examples/rust_to_titan_bridge.rs"

[[example]]
name = "cross_language_module"
path = "examples/cross_language_module.rs"
