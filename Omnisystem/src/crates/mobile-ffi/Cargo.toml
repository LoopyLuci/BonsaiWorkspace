[package]
name = "mobile-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
parking_lot = { workspace = true }
log = "0.4"
serde = { workspace = true }

[lib]
name = "mobile_ffi"
path = "src/lib.rs"

[[bin]]
name = "mobile_ffi_cli"
path = "src/bin/cli.rs"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "decode_latency"
harness = false

[[bench]]
name = "throughput"
harness = false

