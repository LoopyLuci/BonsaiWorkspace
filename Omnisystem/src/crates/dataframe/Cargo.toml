[package]
name = "dataframe"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
polars = { version = "0.46", features = ["lazy", "dtype-full", "strings", "json", "parquet", "regex"] }
serde = { workspace = true }
serde_json = { workspace = true }

[lib]
name = "dataframe"
path = "src/lib.rs"

[[bin]]
name = "dataframe_cli"
path = "src/bin/cli.rs"

[dev-dependencies]
