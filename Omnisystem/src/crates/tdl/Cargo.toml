[package]
name = "tdl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "tls-rustls", "chrono"] }
blake3 = "1"
arrow = "53"
parquet = "53"

[lib]
name = "tdl"
path = "src/lib.rs"

[[bin]]
name = "tdl_cli"
path = "src/bin/cli.rs"

[dev-dependencies]
tempfile = { workspace = true }
