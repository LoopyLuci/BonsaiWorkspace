[package]
name = "android-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
omnisystem-async-runtime = { path = "../../../OmniHarness/crates/omnisystem-async-runtime" }
omnisystem-serialization = { path = "../../../OmniHarness/crates/omnisystem-serialization" }
omnisystem-collections = { path = "../../../OmniHarness/crates/omnisystem-collections" }
omnisystem-observability = { path = "../../../OmniHarness/crates/omnisystem-observability" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
zeroize = "1"
blake3 = "1"
rand = "0.8"
walkdir = "2"

[lib]
name = "android_bridge"
path = "src/lib.rs"

[[bin]]
name = "android_bridge_cli"
path = "src/bin/cli.rs"

[dev-dependencies]


