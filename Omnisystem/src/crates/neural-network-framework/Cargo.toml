[package]
name = "neural-network-framework"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core
ndarray = { version = "0.15", features = ["serde"] }
nalgebra = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async & Concurrency
tokio = { version = "1", features = ["full"] }
rayon = "1.7"
parking_lot = "0.12"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

# Testing
rand = "0.8"

# Optional dependencies for specific features
[features]
default = ["cpu"]
cpu = []
cuda = []
rocm = []

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"

[[bench]]
name = "tensor_ops"
harness = false

[[bench]]
name = "graph_execution"
harness = false
