[workspace]
resolver = "2"
members = [
    "Omnisystem/src/crates/sylva",
    "Omnisystem/src/crates/android-bridge",
    "Omnisystem/src/crates/app-manager-api",
    "Omnisystem/src/crates/app-manager-core",
    "Omnisystem/src/crates/dns-router-core",
    "Omnisystem/src/crates/infrastructure-storage",
    "Omnisystem/src/crates/universal-language-layer",
    "Omnisystem/OmniHarness/crates/actors",
    "Omnisystem/OmniHarness/crates/audit-log",
    "Omnisystem/OmniHarness/crates/capability-registry",
    "Omnisystem/OmniHarness/crates/cas",
    "Omnisystem/OmniHarness/crates/chess",
    "Omnisystem/OmniHarness/crates/coordinator",
    "Omnisystem/OmniHarness/crates/crdt",
    "Omnisystem/OmniHarness/crates/credits",
    "Omnisystem/OmniHarness/crates/extensions",
    "Omnisystem/OmniHarness/crates/fabric",
    "Omnisystem/OmniHarness/crates/failure-finder",
    "Omnisystem/OmniHarness/crates/go",
    "Omnisystem/OmniHarness/crates/go-nn",
    "Omnisystem/OmniHarness/crates/hnsw",
    "Omnisystem/OmniHarness/crates/iot-control",
    "Omnisystem/OmniHarness/crates/ir",
    "Omnisystem/OmniHarness/crates/kdb",
    "Omnisystem/OmniHarness/crates/knowledge",
    "Omnisystem/OmniHarness/crates/mailbox",
    "Omnisystem/OmniHarness/crates/marketplace",
    "Omnisystem/OmniHarness/crates/omnisystem-observability",
    "Omnisystem/OmniHarness/crates/p2p-core",
    "Omnisystem/OmniHarness/crates/p2p-crypto",
    "Omnisystem/OmniHarness/crates/package",
    "Omnisystem/OmniHarness/crates/profiler",
    "Omnisystem/OmniHarness/crates/query",
    "Omnisystem/OmniHarness/crates/remote-desktop",
    "Omnisystem/OmniHarness/crates/sandbox",
    "Omnisystem/OmniHarness/crates/skill-compiler",
    "Omnisystem/OmniHarness/crates/sns",
    "Omnisystem/OmniHarness/crates/swarm",
    "Omnisystem/OmniHarness/crates/transfer-store",
    "Omnisystem/OmniHarness/crates/verify",
    "Omnisystem/OmniHarness/crates/omnisystem-async-runtime",
    "Omnisystem/OmniHarness/crates/omnisystem-collections",
    "Omnisystem/OmniHarness/crates/omnisystem-serialization",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Omnisystem Contributors"]
license = "Apache-2.0"
repository = "https://github.com/omnisystem/platform"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
dashmap = "5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.8"
bytes = "1.5"
futures = "0.3"
axum = "0.7"
tower = "0.4"
http = "1.0"
parking_lot = "0.12"
arc-swap = "1.9"
regex = "1.10"
num_cpus = "1.16"
semver = { version = "1.0", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
