version: 2
updates:
  # Rust — kernel (detached workspace)
  - package-ecosystem: "cargo"
    directory: "/Omnisystem/OmniHarness/kernel"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust", "kernel"]

  # Rust — Tauri Workspace app (path-deps on ../../crates/*, so this
  # effectively covers the shared crates too via their pinned versions)
  - package-ecosystem: "cargo"
    directory: "/Omnisystem/OmniHarness/workspace/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust", "workspace"]

  # TypeScript — VS Code extension
  - package-ecosystem: "npm"
    directory: "/Omnisystem/vscode-omnisystem"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "vscode-extension"]

  # Svelte — Workspace frontend
  - package-ecosystem: "npm"
    directory: "/Omnisystem/OmniHarness/workspace/src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "workspace-frontend"]
    ignore:
      # Svelte 4->5 and Vite 5->6 are breaking majors this project has
      # deliberately not adopted yet (see package.json's own _comment).
      - dependency-name: "svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 restructured its package `exports` map and dropped the
      # classic Compiler API; svelte-check (as of 4.7.3) still depends on
      # that removed API and crashes on load. Re-enable once a svelte-check
      # release supports TS7 (see PR #70's discussion for the exact error).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Python — orchestrator
  - package-ecosystem: "pip"
    directory: "/Omnisystem/OmniHarness/orchestrator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "orchestrator"]

  # GitHub Actions themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
