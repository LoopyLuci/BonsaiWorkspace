name: Svelte — Workspace Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - "Omnisystem/OmniHarness/workspace/src/**"
      - ".github/workflows/workspace-frontend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Omnisystem/OmniHarness/workspace/src/**"
      - ".github/workflows/workspace-frontend.yml"
  workflow_dispatch:

jobs:
  check-and-build:
    name: svelte-check + vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Omnisystem/OmniHarness/workspace/src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Omnisystem/OmniHarness/workspace/src/package-lock.json

      - name: npm ci
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: vite build
        run: npm run build

      - name: Bundle size budget (informational)
        # KNOWN, pre-existing regression as of 2026-07: main entry is ~737KB
        # against a 450KB budget (largely Monaco editor's vendor chunk).
        # Not gated on yet — needs a real code-splitting pass (dynamic
        # import() for Monaco), not a CI workaround. See project notes.
        run: npm run check:bundle
        continue-on-error: true
